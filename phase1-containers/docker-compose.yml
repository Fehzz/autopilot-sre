services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    networks:
      - sre-network

  auth-service:
    build: ./auth-service
    ports:
      - "5001:5001"
    networks:
      - sre-network

  data-service:
    build: ./data-service
    ports:
      - "5002:5002"
    networks:
      - sre-network

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sre-network

networks:
  sre-network:
    driver: bridge
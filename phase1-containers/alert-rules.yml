groups:
  - name: api_alerts
    interval: 15s
    rules:
      - alert: HighRequestRate
        expr: rate(api_gateway_requests_total[1m]) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High request rate on api-gateway"
          description: "Request rate is {{ $value }} req/s"

      - alert: ServiceDown
        expr: up{job="api-gateway"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "api-gateway is down"